<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Barz v0.6 Desktop QA v3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
#stage{display:block;width:100%;height:100dvh;border:0;background:#08090b}
#dock{position:fixed;z-index:9999;left:14px;right:14px;bottom:max(10px,env(safe-area-inset-bottom));padding:8px;border:1px solid #29343a;border-radius:18px;background:rgba(10,15,17,.96);box-shadow:0 16px 48px rgba(0,0,0,.48);backdrop-filter:blur(18px)}
#dockModes{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;padding:3px;border:1px solid #243038;border-radius:12px;background:#080c0e}
#dockModes button{min-height:36px;border:1px solid transparent;border-radius:9px;background:transparent;color:#7f8990;font-size:10px;font-weight:950;letter-spacing:.3px}
#dockModes button.on{border-color:#24616a;background:#0d2528;color:#43dce2}
#dockMain{width:100%;min-height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#20c0ca,#31d9df 55%,#54dec2);color:#05272a;font-size:19px;font-weight:1000;letter-spacing:-.3px}
#dockMain:disabled{background:#151d20;color:#667278;cursor:not-allowed}
#dockTools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
#dockTools button{min-height:38px;border:1px solid #2b3439;border-radius:10px;background:#111719;color:#d9d6cf;font-size:9px;font-weight:900}
#dockTools button:disabled{opacity:.35}
#dockNote{min-height:14px;margin-top:6px;text-align:center;color:#8d989e;font-size:8.5px;line-height:1.35}
#dockNote.ok{color:#58e1c0}#dockNote.warn{color:#f0c879}
@media(min-width:901px){#dock{left:50%;right:auto;width:min(540px,calc(100vw - 28px));transform:translateX(-50%)}}
</style>
</head>
<body>
<iframe id="stage" src="./phase2-desktop-v2.html" allow="microphone; autoplay; encrypted-media; picture-in-picture" title="Barz v0.6 desktop QA v3"></iframe>
<div id="dock" aria-label="Barz LISTEN RAP controller">
  <div id="dockModes"><button type="button" data-mode="listen">🎧 LISTEN</button><button type="button" data-mode="rap">🎤 RAP</button></div>
  <button id="dockMain" type="button" disabled>🎧 BEATを選ぶ</button>
  <div id="dockTools"><button id="dockPlay" type="button" disabled>▶ PLAY / STOP</button><button id="dockNext" type="button" disabled>⏭ NEXT</button></div>
  <div id="dockNote">LISTENではマイクを使わへん。</div>
</div>
<script>
(()=>{
  const stage=document.getElementById('stage');
  const dock=document.getElementById('dock');
  const modeButtons=[...document.querySelectorAll('#dockModes [data-mode]')];
  const main=document.getElementById('dockMain');
  const play=document.getElementById('dockPlay');
  const next=document.getElementById('dockNext');
  const note=document.getElementById('dockNote');
  const ACTION_KEY='barz_phase2_action_mode';
  let mode='listen', inner=null, d=null, nativeGo=null, status=null, radioPlay=null, radioSkip=null, lastStatus='';
  try{mode=localStorage.getItem(ACTION_KEY)||'listen'}catch(_){ }
  if(mode!=='listen'&&mode!=='rap')mode='listen';

  const setNote=(text,kind='')=>{note.textContent=text;note.className=kind||''};
  const persist=()=>{try{localStorage.setItem(ACTION_KEY,mode)}catch(_){ }};
  const beatState=()=>{try{return inner?.contentWindow?.BarzPhase2?.getBeatState?.()||{}}catch(_){return{}}};
  const selected=s=>!!(s&&s.videoId&&!s.reason);

  function setInnerPadding(){
    try{
      const style=d.getElementById('barz-v3-dock-style')||d.createElement('style');
      style.id='barz-v3-dock-style';
      style.textContent=`
        .readyShell{padding-bottom:145px!important}
        .readyDashboard .hero [data-go-slot]{visibility:hidden!important;pointer-events:none!important}
        @media(min-width:901px){.readyShell{padding-bottom:155px!important}}
      `;
      if(!style.parentNode)d.head.appendChild(style);
    }catch(_){ }
  }

  function syncMetric(){
    try{
      const metric=d?.querySelector('.readyDashboard .dashPanel:last-child .metric>div:first-child b');
      if(metric)metric.textContent=mode==='listen'?'🎧 LISTEN':'🎤 RAP';
    }catch(_){ }
  }

  function sync(){
    if(!inner||!d)return;
    const s=beatState(), has=selected(s);
    modeButtons.forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
    syncMetric();
    if(mode==='listen'){
      if(has){
        main.disabled=false;
        main.textContent=s.live?'■ STOP LISTEN':'▶ LISTEN';
        setNote('マイクOFF · Beatだけ流してOK','ok');
      }else{
        main.disabled=true;
        main.textContent='🎧 BEATを選ぶ';
        setNote('LISTENではマイク権限を一切出さへん。');
      }
      play.disabled=!radioPlay||radioPlay.disabled;
      next.disabled=!radioSkip||radioSkip.disabled;
      dock.style.borderColor='#285259';
    }else{
      main.disabled=!has;
      main.textContent=has?'🎤 RAP':'🎧 Beatを先に選ぶ';
      play.disabled=true;next.disabled=true;
      setNote(has?'RAPを押した時だけマイクを確認する。':'先にBeatを選ぶ。');
      dock.style.borderColor='#31445a';
    }
  }

  function setMode(nextMode){
    mode=nextMode==='rap'?'rap':'listen';
    persist();sync();
  }

  function resumeListenAfterMicFailure(){
    mode='listen';persist();sync();
    setNote('マイクを使えんかったからLISTENへ戻した。Beatはそのまま。','warn');
    setTimeout(()=>{
      if(radioPlay&&!radioPlay.disabled&&/PLAY|▶/.test((radioPlay.textContent||'').trim()))radioPlay.click();
      setTimeout(sync,180);
    },180);
  }

  function connect(){
    const v2doc=stage.contentDocument;
    inner=v2doc?.getElementById('barz')||null;
    if(!inner)return setTimeout(connect,120);
    d=inner.contentDocument;
    if(!d)return setTimeout(connect,120);
    nativeGo=d.getElementById('quickRapBtn');
    status=d.getElementById('quickRapStatus');
    radioPlay=d.getElementById('radioPlay');
    radioSkip=d.getElementById('radioSkip');
    if(!nativeGo||!status)return setTimeout(connect,120);
    setInnerPadding();
    setMode(mode);
    setInterval(()=>{
      if(!d?.documentElement?.isConnected)return;
      const txt=(status?.textContent||'').trim();
      if(txt!==lastStatus){
        lastStatus=txt;
        if(mode==='rap'&&/マイクを確認|マイク.*(失敗|拒否|使え|許可)/.test(txt))resumeListenAfterMicFailure();
      }
      sync();
    },350);
  }

  modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  main.addEventListener('click',()=>{
    if(!inner)return;
    const s=beatState();
    if(mode==='rap'){
      if(!selected(s)||!nativeGo)return sync();
      nativeGo.click();
      return;
    }
    if(radioPlay&&!radioPlay.disabled)radioPlay.click();
    setTimeout(sync,120);
  });
  play.addEventListener('click',()=>{if(radioPlay&&!radioPlay.disabled)radioPlay.click();setTimeout(sync,120)});
  next.addEventListener('click',()=>{if(radioSkip&&!radioSkip.disabled)radioSkip.click();setTimeout(sync,160)});

  stage.addEventListener('load',()=>setTimeout(connect,120));
  setTimeout(connect,240);
})();
</script>
</body>
</html>
