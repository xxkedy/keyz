<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Barz v0.6 Compact QA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b0d}
#barz{display:block;width:100%;height:100dvh;border:0;background:#0a0b0d}
</style>
</head>
<body>
<iframe id="barz" src="./?phase2=1" allow="microphone; autoplay; encrypted-media; picture-in-picture" title="Barz v0.6 compact QA"></iframe>
<script>
(()=>{
  const frame=document.getElementById('barz');
  frame.addEventListener('load',()=>{
    const d=frame.contentDocument;
    if(!d)return;

    const css=d.createElement('style');
    css.id='phase2CompactOverride';
    css.textContent=`
      body{overflow:hidden!important;background:#090a0c!important}
      .readyShell{position:relative;min-height:100dvh!important;height:100dvh!important;max-width:720px!important;padding:max(10px,env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))!important;grid-template-rows:auto minmax(0,1fr)!important;gap:8px!important}
      .readyHeader{align-items:center!important;min-height:42px!important;margin:0!important}
      .readyHeader .brand h1{font-size:29px!important;letter-spacing:-1px!important}
      .readyMeta{gap:7px!important}
      .readyVersion{font-size:8px!important;opacity:.68}
      .menuButton{width:40px!important;height:40px!important;border-radius:12px!important;background:#111417!important}

      .readyCenter{align-self:center!important;justify-self:center!important;place-content:initial!important;display:flex!important;flex-direction:column!important;align-items:center!important;width:min(100%,560px)!important;min-height:0!important;padding:18px!important;border:1px solid #1d383c!important;border-radius:24px!important;background:linear-gradient(180deg,rgba(17,34,37,.94),rgba(13,17,19,.94))!important;box-shadow:0 18px 46px rgba(0,0,0,.28)!important}
      .readyCenter:before{content:'⚡ READY';display:block;margin-bottom:8px;color:#58e1c0;font-size:9px;font-weight:950;letter-spacing:1.8px}
      .conditionButton{padding:7px 10px!important;border-radius:14px!important;font-size:clamp(26px,5vw,38px)!important;line-height:1!important}
      .readyStatus{margin-top:7px!important;min-height:16px!important;color:#aab2b8!important;font-size:10px!important;letter-spacing:.35px!important}
      .readyStatus:before{content:'🎧 ';filter:saturate(.85)}
      .reviewButton{display:none!important}
      .readyQuickRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:100%;margin-top:14px}
      .readyQuickRow button{min-height:42px;border:1px solid #2b3137;border-radius:13px;background:#101316;color:#f4f1e9;font-size:10px;font-weight:900;letter-spacing:.35px}
      .readyQuickRow button:active{transform:scale(.985)}
      .readyQuickRow button[data-role="review"].hasReview{border-color:#655a42;color:#f0dcae;background:#17140e}
      .readyQuickRow button:disabled{opacity:.42}

      .goHero{order:10!important;width:100%!important;min-height:76px!important;height:auto!important;border-radius:18px!important;font-size:clamp(27px,6vw,38px)!important;letter-spacing:-1px!important;background:linear-gradient(135deg,#20c0ca 0%,#29d6df 58%,#54dec2 100%)!important;color:#05272a!important;box-shadow:0 12px 30px rgba(41,214,223,.14)!important;margin:12px 0 0!important}
      .goHero:active{transform:scale(.988)!important}

      .rapScreen{height:100dvh!important;max-width:720px!important;grid-template-rows:auto auto minmax(0,1fr) auto auto!important;gap:6px!important;padding:max(7px,env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))!important;background:#090a0c!important}
      .rapPlayer{width:min(100%,460px)!important;margin:0 auto!important;min-height:200px!important;max-height:32dvh!important;border-radius:14px!important;box-shadow:0 10px 28px rgba(0,0,0,.34)!important}
      .rapPlayer .playerWrap{display:block!important;width:100%;height:100%;max-width:none;margin:0;aspect-ratio:auto;border-radius:0}
      .rapMeta{font-size:10px!important;letter-spacing:.45px!important;line-height:1!important;color:#9da5ab!important}
      .rapPrompt{align-self:stretch!important;padding:10px 12px!important;align-content:center!important;border:1px solid #1d383c!important;border-radius:18px!important;background:#0d1214!important}
      .rapPrompt:before{content:'💭 WORD';display:block;margin-bottom:5px;color:#7f898f;font-size:8px;font-weight:950;letter-spacing:1.45px}
      .rapWord{font-size:clamp(36px,9vw,64px)!important;letter-spacing:-1.8px!important}
      .rapRel{min-height:15px!important;margin-top:4px!important;font-size:11px!important;color:#f4f1e9!important}
      .rapKeep{min-height:58px!important;border-radius:17px!important;font-size:clamp(20px,4.7vw,28px)!important;background:#f2e5c7!important;color:#20180a!important}
      .rapActions{grid-template-columns:.82fr 1.55fr .82fr!important;gap:7px!important}
      .rapAction{min-height:46px!important;border-radius:13px!important;font-size:10px!important}
      .rapAction.next{font-size:14px!important}

      @media(max-width:520px){
        .readyShell{padding-left:10px!important;padding-right:10px!important}
        .readyVersion{display:none!important}
        .readyCenter{padding:15px 12px 12px!important;border-radius:20px!important}
        .conditionButton{font-size:28px!important}
        .readyQuickRow{gap:5px!important;margin-top:11px!important}
        .readyQuickRow button{min-height:40px!important;font-size:9px!important}
        .goHero{min-height:70px!important;font-size:30px!important;margin-top:10px!important}
        .rapScreen{padding-left:7px!important;padding-right:7px!important;gap:5px!important}
        .rapPlayer{width:100%!important;min-height:200px!important;max-height:30dvh!important}
        .rapPrompt{padding:8px 10px!important}
        .rapKeep{min-height:54px!important}
        .rapAction{min-height:44px!important;font-size:9.5px!important}
      }
      @media(max-height:720px){
        .readyCenter{padding:12px!important}
        .readyCenter:before{margin-bottom:4px!important}
        .readyQuickRow{margin-top:9px!important}
        .goHero{min-height:62px!important;margin-top:9px!important}
        .rapPlayer{width:min(44vh,100%)!important;min-height:200px!important}
        .rapPrompt{padding-top:7px!important;padding-bottom:7px!important}
        .rapKeep{min-height:50px!important}
        .rapAction{min-height:40px!important}
      }
    `;
    d.head.appendChild(css);

    const review=d.getElementById('reviewButton');
    const condition=d.getElementById('conditionButton');
    const menuButton=d.getElementById('menuButton');
    const readyCenter=d.querySelector('.readyCenter');

    if(readyCenter){
      const row=d.createElement('div');
      row.className='readyQuickRow';
      row.innerHTML='<button type="button" data-role="beat">🎧 BEAT</button><button type="button" data-role="review">↺ REVIEW</button><button type="button" data-role="more">⚙ MENU</button>';
      readyCenter.appendChild(row);
      row.querySelector('[data-role="beat"]').addEventListener('click',()=>condition&&condition.click());
      row.querySelector('[data-role="more"]').addEventListener('click',()=>menuButton&&menuButton.click());
      const reviewProxy=row.querySelector('[data-role="review"]');
      reviewProxy.addEventListener('click',()=>review&&review.click());
      const syncReview=()=>{
        if(!review)return;
        const raw=(review.textContent||'').trim();
        const n=(raw.match(/\d+/)||[])[0];
        const on=review.classList.contains('on');
        reviewProxy.textContent=on?(n?`↺ REVIEW ${n}`:'↺ REVIEW'):'✓ CLEAR';
        reviewProxy.classList.toggle('hasReview',on);
        reviewProxy.disabled=!on;
      };
      if(review)new MutationObserver(syncReview).observe(review,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
      syncReview();
    }

    const go=d.getElementById('quickRapBtn');
    if(go){
      if(readyCenter)readyCenter.appendChild(go);
      const syncGo=()=>{
        const t=(go.textContent||'').trim();
        if(t==='GO')go.textContent='🎤 RAP';
      };
      new MutationObserver(syncGo).observe(go,{childList:true,subtree:true});
      syncGo();
    }

    const labels={rapRetake:'🔁 RETAKE',rapNext:'⏭ NEXT',rapEnd:'⏹ END'};
    Object.entries(labels).forEach(([id,text])=>{const el=d.getElementById(id);if(el)el.textContent=text});
  });
})();
</script>
</body>
</html>
