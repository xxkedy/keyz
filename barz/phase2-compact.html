<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Barz v0.6 Compact QA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b0d}
#barz{display:block;width:100%;height:100dvh;border:0;background:#0a0b0d}
</style>
</head>
<body>
<iframe id="barz" src="./?phase2=1" allow="microphone; autoplay; encrypted-media; picture-in-picture" title="Barz v0.6 compact QA"></iframe>
<script>
(()=>{
  const frame=document.getElementById('barz');
  frame.addEventListener('load',()=>{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    const css=d.createElement('style');
    css.id='phase2CompactOverride';
    css.textContent=`
      body{overflow:hidden!important}
      .readyShell{position:relative;min-height:100dvh!important;height:100dvh!important;max-width:720px!important;padding:max(12px,env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom))!important;grid-template-rows:auto minmax(0,1fr) auto!important;gap:8px!important}
      .readyHeader{align-items:center!important;min-height:44px!important}
      .readyHeader .brand h1{font-size:30px!important}
      .readyMeta{gap:7px!important}
      .readyVersion{font-size:8px!important;opacity:.72}
      .menuButton{width:42px!important;height:42px!important;border-radius:13px!important}
      .readyCenter{place-content:center!important;padding:4px 0!important}
      .conditionButton{padding:8px 12px!important;font-size:clamp(27px,6vw,40px)!important;line-height:1!important}
      .readyStatus{margin-top:7px!important;min-height:17px!important;font-size:10px!important;color:#a9b0b6!important}
      .readyStatus:before{content:'🎧 ';filter:saturate(.85)}
      .reviewButton{display:none!important}
      .compactReviewBadge{display:none;min-height:34px;padding:0 10px;border:1px solid #645b48;border-radius:999px;background:#15130f;color:#f1dfb8;font-size:10px;font-weight:900;white-space:nowrap}
      .compactReviewBadge.on{display:inline-flex;align-items:center;justify-content:center}
      .goHero{justify-self:center;width:min(100%,560px)!important;min-height:116px!important;height:auto!important;border-radius:26px!important;font-size:clamp(30px,7vw,46px)!important;letter-spacing:-1.5px!important;background:linear-gradient(135deg,#22c6cf 0%,#29d6df 58%,#4be0c7 100%)!important;box-shadow:0 12px 34px rgba(41,214,223,.15)!important;margin:0!important}
      .goHero:before{content:'🎤 ';font-size:.82em}

      .rapScreen{height:100dvh!important;max-width:720px!important;grid-template-rows:auto auto minmax(0,1fr) auto auto!important;gap:6px!important;padding:max(8px,env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom))!important}
      .rapPlayer{width:min(100%,500px)!important;min-height:200px!important;max-height:34dvh!important;border-radius:14px!important}
      .rapMeta{font-size:10px!important;letter-spacing:.5px!important;line-height:1!important}
      .rapPrompt{padding:2px 8px!important;align-content:center!important}
      .rapPrompt:before{content:'💭 WORD';display:block;margin-bottom:7px;color:#8f989f;font-size:9px;font-weight:900;letter-spacing:1.5px}
      .rapWord{font-size:clamp(38px,10vw,68px)!important;letter-spacing:-2px!important}
      .rapRel{min-height:16px!important;margin-top:5px!important;font-size:11px!important;color:#f4f1e9!important}
      .rapKeep{min-height:62px!important;border-radius:18px!important;font-size:clamp(21px,5vw,30px)!important;background:#f2e5c7!important}
      .rapActions{grid-template-columns:.85fr 1.55fr .85fr!important;gap:7px!important}
      .rapAction{min-height:50px!important;border-radius:14px!important;font-size:11px!important}
      .rapAction.next{font-size:14px!important}

      @media(max-width:520px){
        .readyShell{padding-left:12px!important;padding-right:12px!important}
        .readyVersion{display:none!important}
        .conditionButton{font-size:30px!important}
        .goHero{min-height:104px!important;font-size:34px!important}
        .rapScreen{padding-left:8px!important;padding-right:8px!important;gap:5px!important}
        .rapPlayer{width:100%!important;min-height:200px!important;max-height:31dvh!important}
        .rapKeep{min-height:58px!important}
        .rapAction{min-height:46px!important;font-size:10px!important}
      }
      @media(max-height:720px){
        .readyShell{grid-template-rows:auto minmax(0,1fr) auto!important}
        .goHero{min-height:88px!important}
        .rapPlayer{width:min(46vh,100%)!important;min-height:200px!important}
        .rapPrompt:before{margin-bottom:4px!important}
        .rapKeep{min-height:54px!important}
        .rapAction{min-height:43px!important}
      }
    `;
    d.head.appendChild(css);

    const menu=d.querySelector('.readyMeta');
    const review=d.getElementById('reviewButton');
    if(menu&&review){
      const badge=d.createElement('button');
      badge.type='button';
      badge.className='compactReviewBadge';
      badge.id='compactReviewBadge';
      badge.addEventListener('click',()=>review.click());
      menu.insertBefore(badge,menu.querySelector('.menuButton'));
      const syncReview=()=>{
        const raw=(review.textContent||'').trim();
        const n=(raw.match(/\d+/)||[])[0];
        badge.textContent=n?`↺ ${n}`:'↺ REVIEW';
        badge.classList.toggle('on',review.classList.contains('on'));
      };
      new MutationObserver(syncReview).observe(review,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
      syncReview();
    }

    const go=d.getElementById('quickRapBtn');
    if(go){
      const syncGo=()=>{
        const t=(go.textContent||'').trim();
        if(t==='GO')go.textContent='RAP';
      };
      new MutationObserver(syncGo).observe(go,{childList:true,subtree:true});
      syncGo();
    }

    const labels={rapRetake:'🔁 RETAKE',rapNext:'⏭ NEXT',rapEnd:'⏹ END'};
    Object.entries(labels).forEach(([id,text])=>{const el=d.getElementById(id);if(el)el.textContent=text});
  });
})();
</script>
</body>
</html>
