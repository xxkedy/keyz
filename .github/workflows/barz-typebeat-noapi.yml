name: Barz Type Beat cache (no Google API)

on:
  push:
    branches: [barz-v0.6-phase2-ready]
    paths:
      - '.github/scripts/update-barz-typebeats-noapi.mjs'
      - '.github/workflows/barz-typebeat-noapi.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barz-typebeat-noapi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: barz-v0.6-phase2-ready
          fetch-depth: 0

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh Type Beat cache
        run: node .github/scripts/update-barz-typebeats-noapi.mjs

      - name: Validate generated cache
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('barz/beat-cache.json','utf8'));
          const artists=['Bladee','Ecco2k','Future','Travis Scott','Ken Carson','Playboi Carti','Destroy Lonely','Yeat'];
          const counts=artists.map(a=>[a,(j.slots?.[`TYPE:${a}|HOT`]||[]).length]);
          console.log(counts.map(([a,n])=>`${a}: ${n}`).join('\n'));
          if(!counts.some(([,n])=>n>0)) throw new Error('No Type Beat cache generated');
          NODE

      - name: Commit cache
        shell: bash
        run: |
          if git diff --quiet -- barz/beat-cache.json; then
            echo "No Type Beat cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barz/beat-cache.json
          git commit -m "Update Barz Type Beat cache [skip ci]"
          git push origin HEAD:barz-v0.6-phase2-ready
