name: Barz v0.6 in-app Type Beat

on:
  push:
    branches: [barz-v0.6-phase2-ready]
    paths:
      - '.github/scripts/patch-barz-v060-inline-typebeat.mjs'
      - '.github/scripts/fix-barz-v060-inline-cards.mjs'
      - '.github/workflows/barz-v060-inline-typebeat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barz-v060-inline-typebeat
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barz-v0.6-phase2-ready
          fetch-depth: 0
      - name: Apply in-app candidate patch
        run: node .github/scripts/patch-barz-v060-inline-typebeat.mjs
      - name: Fix candidate card branch
        run: node .github/scripts/fix-barz-v060-inline-cards.mjs
      - name: Validate
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['barz/index.html','barz/phase2-desktop-v2.html']){
            const html=fs.readFileSync(f,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
            if(!blocks.length) throw new Error('No inline JS: '+f);
            fs.writeFileSync('/tmp/'+f.split('/').pop()+'.js',blocks.join('\n'));
          }
          const core=fs.readFileSync('barz/index.html','utf8');
          const qa=fs.readFileSync('barz/phase2-desktop-v2.html','utf8');
          if(!core.includes('window.BarzPhase2=')) throw new Error('BarzPhase2 API missing');
          if(!core.includes('TYPE:')) throw new Error('TYPE slot missing');
          if(!qa.includes('<div class="candidateList" data-candidate-slot></div>')) throw new Error('candidate list UI missing');
          if(!qa.includes('setTimeout(loadTypeCandidates,0)')) throw new Error('candidate loader missing');
          if(!qa.includes('playTypeCandidate')) throw new Error('candidate click missing');
          NODE
          node --check /tmp/index.html.js
          node --check /tmp/phase2-desktop-v2.html.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- barz/index.html barz/phase2-desktop-v2.html; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add barz/index.html barz/phase2-desktop-v2.html
          git commit -m 'feat(barz): keep Type Beat discovery inside Barz [skip ci]'
          git push origin HEAD:barz-v0.6-phase2-ready
