name: Barz v0.6 Phase 2 branch patch

on:
  push:
    branches: [barz-v0.6-phase2-ready]
    paths:
      - '.github/scripts/patch-barz-v060-typebeat.mjs'
      - '.github/workflows/barz-v060-phase2-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barz-v060-phase2-branch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: barz-v0.6-phase2-ready
          fetch-depth: 0

      - name: Patch Barz Phase 2 core
        run: node .github/scripts/patch-barz-v060-typebeat.mjs

      - name: Validate Barz JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('barz/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1]).filter(Boolean);
          if (!blocks.length) throw new Error('No inline Barz JavaScript found');
          fs.writeFileSync('/tmp/barz-v060-inline.js', blocks.join('\n'));
          if (!html.includes('minSec:60')) throw new Error('1 minute Beat rule missing');
          if (!html.includes("quickRapStatus.textContent='Beat確認中…'")) throw new Error('RAP start state missing');
          NODE
          node --check /tmp/barz-v060-inline.js

      - name: Commit patched core
        shell: bash
        run: |
          if git diff --quiet -- barz/index.html; then
            echo "No Barz core changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barz/index.html
          git commit -m "fix(barz): make type-beat RAP start explicit [skip ci]"
          git push origin HEAD:barz-v0.6-phase2-ready
