name: Patch Keyz Razer assignments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-keyz-razer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Keyz Razer assignments
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          sw_path = Path('sw.js')

          index = index_path.read_text(encoding='utf-8')

          old = """const RZ=[['①','Ctrl+X','切り取り'],['②','Alt+A','全選択'],['③','Ctrl+⇧+T','閉じたタブ復元'],
          ['④','Ctrl+C','コピー'],['⑤','Ctrl+V','貼り付け'],['⑥','Win+⇧+S','範囲スクショ'],
          ['⑦','Delete','削除'],['⑧','Enter','決定'],['⑨','Win+H','音声入力'],
          ['⑩','Ctrl','＋ホイールで拡大縮小'],['⑪','Ctrl+Z','戻す'],['⑫','Ctrl+L','アドレスバー']];"""

          new = """const RZ=[['①','Ctrl+X','切り取り'],['②','F5','Playlist'],['③','F6','Channel Rack'],
          ['④','Ctrl+C','コピー'],['⑤','Ctrl+V','貼り付け'],['⑥','F7','Piano Roll'],
          ['⑦','Delete','削除'],['⑧','Num Enter','決定'],['⑨','Win+H','音声入力'],
          ['⑩','F9','Mixer'],['⑪','Alt+PrtScn','前面ウィンドウをコピー'],['⑫','F12','FLの全小窓を閉じる']];"""

          if old not in index:
              raise SystemExit('Expected old Razer block not found; stopping safely.')

          index = index.replace(old, new, 1)
          index = index.replace(
              '2026-07-19 ・ v2.1 ・ Keyz — ショートカット早見表',
              '2026-07-30 ・ v2.2 ・ Keyz — ショートカット早見表',
              1,
          )
          index_path.write_text(index, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const C = 'keyz-v4';", "const C = 'keyz-v5';", 1)
          sw_path.write_text(sw, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Update Razer Naga assignments in Keyz"
          git push
