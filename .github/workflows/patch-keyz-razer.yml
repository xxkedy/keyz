name: Patch Keyz G604 tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-keyz-razer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Logicool G604 tab to Keyz
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          sw_path = Path('sw.js')

          index = index_path.read_text(encoding='utf-8')

          old_tab = """ {id:'razer',l:'🟢 Razer',cat:'dev',os:'win',note:'Naga V2 HyperSpeed・親指側12ボタンの実割当。'}
          ];"""

          new_tab = """ {id:'g604',l:'🖱 G604',cat:'dev',os:'mac',note:'Logicool G604・Mac「デスクトップ：デフォルト」の確定配置。',layers:[
            {n:'6ボタン',nokb:true,ex:[
              {k:'左上 / G6',a:'Mac音声入力（⌃⇧D）'},
              {k:'右上 / G9',a:'全画面スクショをコピー（⌃⇧⌘3）'},
              {k:'左中央',a:'コピー（⌘C）'},
              {k:'右中央 / G8',a:'貼り付け（⌘V）'},
              {k:'左下',a:'削除（Delete）'},
              {k:'右下',a:'確定・送信（Enter）'}
            ]}
           ]},
           {id:'razer',l:'🟢 Razer',cat:'dev',os:'win',note:'Naga V2 HyperSpeed・親指側12ボタンの実割当。'}
          ];"""

          if "{id:'g604'" not in index:
              if old_tab not in index:
                  raise SystemExit('Expected Razer tab anchor not found; stopping safely.')
              index = index.replace(old_tab, new_tab, 1)

          index = index.replace(
              '2026-07-30 ・ v2.2 ・ Keyz — ショートカット早見表',
              '2026-08-05 ・ v2.3 ・ Keyz — ショートカット早見表',
              1,
          )
          index_path.write_text(index, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const C = 'keyz-v5';", "const C = 'keyz-v6';", 1)
          sw_path.write_text(sw, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Logicool G604 tab to Keyz"
          git push
