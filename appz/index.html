<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Appz">
<link rel="manifest" href="./manifest.json?v=20260806-1">
<link rel="apple-touch-icon" href="./icon-180.png?v=20260729-1">
<link rel="icon" href="./icon-192.png?v=20260729-1">
<title>Appz</title>
<style>
:root{--bg:#08090c;--panel:#14161c;--line:rgba(255,255,255,.1);--text:#f8f7f2;--muted:#9a9da8;--dim:#686b75;--amber:#ff9d24;--cyan:#2bd9ef;--green:#53e38b;--orange:#ff7043}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
body{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;overflow-x:hidden;background:radial-gradient(circle at 88% -8%,rgba(255,157,36,.12),transparent 30%),var(--bg)}
header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}.brand h1{font-size:31px;line-height:1;margin:0;font-weight:950;letter-spacing:-1.4px}.brand h1 span{color:var(--amber)}.version{color:var(--dim);font-size:8.5px;font-weight:800;letter-spacing:.5px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 6px}.section-head b{font-size:8.5px;letter-spacing:1.6px;color:#777b85}.section-head span{font-size:8px;color:#555963}
.quick{--accent:var(--amber);width:100%;min-height:104px;padding:14px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid rgba(255,157,36,.34);border-radius:24px;background:linear-gradient(135deg,rgba(255,157,36,.16),rgba(20,22,28,.92) 52%);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:0 18px 45px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px);transition:transform .09s,border-color .15s}.quick:active{transform:scale(.982)}.quick.running{--accent:var(--cyan);border-color:rgba(43,217,239,.35);background:linear-gradient(135deg,rgba(43,217,239,.14),rgba(20,22,28,.94) 52%)}.quick.done{--accent:var(--green);border-color:rgba(83,227,139,.35);background:linear-gradient(135deg,rgba(83,227,139,.14),rgba(20,22,28,.94) 52%)}.hero-icon{width:58px;height:58px;border-radius:18px;background:rgba(5,6,9,.72);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:29px;box-shadow:inset 0 1px rgba(255,255,255,.05)}.quick-copy{min-width:0}.quick-kicker{display:block;margin-bottom:4px;color:var(--accent);font-size:8.5px;font-weight:950;letter-spacing:1.4px}.quick h2{font-size:19px;line-height:1.12;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick p{font-size:10px;line-height:1.3;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick-time{min-width:58px;padding:9px 8px;border-radius:999px;background:rgba(0,0,0,.25);text-align:center;color:var(--accent);font-size:11px;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:.1px}
.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;row-gap:9px}.tool{min-width:0;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-radius:18px;color:var(--text);text-decoration:none;transition:transform .08s,background .12s}.tool:active{transform:scale(.94);background:rgba(255,255,255,.04)}.tool-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);border-radius:18px;font-size:29px;background:linear-gradient(145deg,#1d2029,#101218);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08)}.tool-name{max-width:100%;font-size:12.5px;line-height:1.05;font-weight:900;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool[data-kind='learn'] .tool-icon{background:linear-gradient(145deg,rgba(43,217,239,.25),#101218 70%);border-color:rgba(43,217,239,.22)}.tool[data-kind='create'] .tool-icon{background:linear-gradient(145deg,rgba(255,112,67,.27),#101218 70%);border-color:rgba(255,112,67,.22)}.tool[data-kind='life'] .tool-icon{background:linear-gradient(145deg,rgba(83,227,139,.24),#101218 70%);border-color:rgba(83,227,139,.2)}.tool[data-kind='faith'] .tool-icon{background:linear-gradient(145deg,rgba(255,157,36,.28),rgba(83,227,139,.12) 42%,#101218 72%);border-color:rgba(255,157,36,.22)}.tool[data-kind='tool'] .tool-icon{background:linear-gradient(145deg,rgba(160,165,180,.2),#101218 70%);border-color:rgba(180,185,200,.14)}
.standby-row{min-height:52px;margin-top:9px;padding:7px 8px 7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:16px;background:rgba(20,22,28,.66)}.standby-caption{font-size:8.5px;font-weight:900;letter-spacing:1.3px;color:var(--dim);flex:0 0 auto}.standby-links{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:2px}.standby-link{min-width:0;display:flex;align-items:center;gap:5px;padding:5px 7px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:800;border-radius:12px}.standby-link:active{background:rgba(255,255,255,.04)}.standby-link small{color:var(--dim);font-size:8px;font-weight:700}.standby-emoji{font-size:18px}
footer{text-align:center;color:#3f424b;font-size:7.5px;margin-top:7px;letter-spacing:.8px}
@media(max-width:350px){body{padding-left:10px;padding-right:10px}.tool-grid{column-gap:3px}.tool-icon{width:52px;height:52px;border-radius:16px;font-size:26px}.tool-name{font-size:11.5px}.tool{min-height:76px}.quick{grid-template-columns:52px minmax(0,1fr) auto;padding:12px;gap:9px}.hero-icon{width:52px;height:52px;border-radius:16px}.standby-link small{display:none}}
@media(max-height:650px){body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}header{height:32px}.section-head{margin-top:8px;margin-bottom:5px}.quick{min-height:94px}.tool{min-height:72px}.tool-icon{width:51px;height:51px;border-radius:15px;font-size:25px}.tool-name{font-size:11.5px}.standby-row{min-height:42px;margin-top:6px}footer{margin-top:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><h1>App<span>z</span></h1></div><div class="version">v9.4 · 2026.08.27</div></header>

<div class="section-head"><b>GAPZ</b><span>1タップで開始</span></div>
<button class="quick" type="button" id="gapzBtn">
<span class="hero-icon" id="gapzIcon">🎧</span>
<span class="quick-copy"><span class="quick-kicker">NEXT</span><h2 id="gapzTitle">Shadowz</h2><p id="gapzStatus">今日のおすすめを準備中</p></span>
<span class="quick-time" id="gapzTime">START</span>
</button>

<div class="section-head"><b>APPS</b><span>よく使う7つ</span></div>
<div class="tool-grid">
<a class="tool" data-tool data-kind="learn" href="https://xxkedy.github.io/flowz/" aria-label="Flowz 英語スピーキング"><span class="tool-icon">🗣️</span><span class="tool-name">Flowz</span></a>
<a class="tool" data-tool data-kind="create" href="https://xxkedy.github.io/keyz/barz/?quick=1" aria-label="Barz すぐラップ開始"><span class="tool-icon">🎤</span><span class="tool-name">Barz</span></a>
<a class="tool" data-tool data-kind="life" href="https://xxkedy.github.io/gainz/" aria-label="Gainz 家トレ"><span class="tool-icon">💪</span><span class="tool-name">Gainz</span></a>
<a class="tool" data-tool data-kind="life" href="https://xxkedy.github.io/keyz/urgez/" aria-label="Urgez 誘惑ストッパー"><span class="tool-icon">🛡️</span><span class="tool-name">Urgez</span></a>
<a class="tool" data-tool data-kind="faith" href="https://xxkedy.github.io/keyz/islamz/" aria-label="Islamz イスラム学習"><span class="tool-icon">🕌</span><span class="tool-name">Islamz</span></a>
<a class="tool" data-tool data-kind="tool" href="https://xxkedy.github.io/keyz/" aria-label="Keyz ショートカット"><span class="tool-icon">⌨️</span><span class="tool-name">Keyz</span></a>
<a class="tool" data-tool data-kind="create" href="https://xxkedy.github.io/tagz/" aria-label="Tagz ビート名"><span class="tool-icon">🏷️</span><span class="tool-name">Tagz</span></a>
</div>

<div class="standby-row">
<span class="standby-caption">STANDBY</span>
<div class="standby-links">
<a class="standby-link" data-tool href="https://xxkedy.github.io/digz/" aria-label="Digz 未運用"><span class="standby-emoji">📖</span><span>Digz</span><small>未運用</small></a>
<a class="standby-link" data-tool href="https://xxkedy.github.io/spotz/" aria-label="Spotz 改修待ち"><span class="standby-emoji">📍</span><span>Spotz</span><small>改修待ち</small></a>
</div>
</div>

<footer>ONE SCREEN DECK</footer>
<script>
(function(){
  var KEYS={shadowEnd:'appz_shadow15_end',shadowDone:'appz_gapz_shadow_done',shadowSource:'appz_gapz_shadow_source',xEnd:'appz_gapz_x_end',xSessions:'appz_gapz_x_sessions',history:'appz_gapz_history'};
  var SHADOW_MS=15*60*1000,X_MS=3*60*1000,X_URL='https://x.com/i/bookmarks',timer=null,ticker=null,current=null;
  var SOURCES={
    improv:{id:'improv',label:'TED',url:'https://www.ted.com/talks/charles_limb_your_brain_on_improv'},
    sound:{id:'sound',label:'TED',url:'https://www.ted.com/talks/dallas_taylor_what_silence_can_teach_you_about_sound'},
    confidence:{id:'confidence',label:'TED',url:'https://www.ted.com/talks/david_kelley_how_to_build_your_creative_confidence'}
  };
  var SOURCE_IDS=['sound','improv','confidence'];
  var btn=document.getElementById('gapzBtn'),icon=document.getElementById('gapzIcon'),title=document.getElementById('gapzTitle'),status=document.getElementById('gapzStatus'),time=document.getElementById('gapzTime');
  function read(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value}catch(e){return fallback}}
  function write(key,value){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,String(value))}catch(e){}}
  function readNumber(key){return Number(read(key,0)||0)}
  function dayKey(value){var d=value instanceof Date?value:new Date(value||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
  function sourceForToday(){var saved=read(KEYS.shadowSource,'');if(saved&&SOURCES[saved])return SOURCES[saved];var stamp=Number(dayKey().replace(/-/g,''));return SOURCES[SOURCE_IDS[stamp%SOURCE_IDS.length]]}
  function record(kind,source,endedAt){var items=[];try{items=JSON.parse(read(KEYS.history,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}items.push({kind:kind,source:source||'',completedAt:new Date(endedAt).toISOString()});write(KEYS.history,JSON.stringify(items.slice(-30)))}
  function addXSession(endedAt){var day=dayKey(endedAt),data={day:day,count:0};try{var parsed=JSON.parse(read(KEYS.xSessions,'{}'));if(parsed&&parsed.day===day)data=parsed}catch(e){}data.count=Number(data.count||0)+1;write(KEYS.xSessions,JSON.stringify(data))}
  function finishExpired(showNotice){
    var now=Date.now(),shadowEnd=readNumber(KEYS.shadowEnd),xEnd=readNumber(KEYS.xEnd),finished=null;
    if(shadowEnd&&shadowEnd<=now){var source=read(KEYS.shadowSource,'');write(KEYS.shadowDone,dayKey(shadowEnd));write(KEYS.shadowEnd,null);write(KEYS.shadowSource,null);record('shadowz',source,shadowEnd);finished={kind:'shadow',title:'🎧 Shadowz 完了',body:'15分完了。次はXブクマを3件。'}}
    if(xEnd&&xEnd<=now){write(KEYS.xEnd,null);addXSession(xEnd);record('x-bookmarks','x',xEnd);finished={kind:'x',title:'🔖 X学習 完了',body:'3分完了。次回は続きの3件。'}}
    if(finished&&showNotice)notify(finished.title,finished.body);
    return finished
  }
  function choose(){
    var now=Date.now(),shadowEnd=readNumber(KEYS.shadowEnd),xEnd=readNumber(KEYS.xEnd),source=sourceForToday();
    if(shadowEnd>now)return{kind:'shadow',running:true,end:shadowEnd,source:source,url:source.url};
    if(xEnd>now)return{kind:'x',running:true,end:xEnd,url:X_URL};
    if(read(KEYS.shadowDone,'')!==dayKey())return{kind:'shadow',running:false,source:source,url:source.url};
    return{kind:'x',running:false,url:X_URL}
  }
  function render(done){
    current=choose();btn.classList.remove('running','done');
    if(done){btn.classList.add('done');time.textContent='DONE'}else if(current.running){btn.classList.add('running');time.textContent=fmt(current.end-Date.now())}else{time.textContent='START'}
    if(current.kind==='shadow'){icon.textContent='🗣️';title.textContent='Shadowz · '+current.source.label;status.textContent=current.running?'英語のまま追いかけ中':'英字幕だけ · 訳さず15分'}
    else{icon.textContent='🔖';title.textContent='Xブクマ · 3件';status.textContent=current.running?'ホームTLを開かず学習中':'短時間のおすすめ · ホームTLなし'}
  }
  function notify(head,body){if('serviceWorker' in navigator&&'Notification' in window&&Notification.permission==='granted'){navigator.serviceWorker.ready.then(function(reg){return reg.showNotification(head,{body:body,tag:'appz-gapz',renotify:true})}).catch(function(){try{new Notification(head,{body:body})}catch(e){}})}document.title='✓ Gapz完了 · Appz'}
  function arm(){
    clearTimeout(timer);clearInterval(ticker);timer=null;ticker=null;
    var done=finishExpired(false);render(done);
    if(done)setTimeout(function(){document.title='Appz';render(false)},1800);
    current=choose();if(!current.running)return;
    var left=current.end-Date.now();timer=setTimeout(function(){var finished=finishExpired(true);render(finished);setTimeout(function(){document.title='Appz';render(false)},1800)},left);
    ticker=setInterval(function(){var action=choose();if(!action.running){clearInterval(ticker);render(false)}else time.textContent=fmt(action.end-Date.now())},1000)
  }
  function askNotification(){if('Notification' in window&&Notification.permission==='default'){try{var request=Notification.requestPermission();if(request&&request.catch)request.catch(function(){})}catch(e){}}}
  function start(){
    finishExpired(false);current=choose();
    if(!current.running){if(current.kind==='shadow'){write(KEYS.shadowSource,current.source.id);write(KEYS.shadowEnd,Date.now()+SHADOW_MS)}else{write(KEYS.xEnd,Date.now()+X_MS)}}
    var tab=window.open(current.url,'_blank');if(tab){try{tab.opener=null}catch(e){}}else{location.href=current.url}if(navigator.vibrate)navigator.vibrate(12);askNotification();document.title='Gapz · Appz';arm()
  }
  btn.addEventListener('click',start);
  document.querySelectorAll('a[data-tool]').forEach(function(card){card.addEventListener('click',function(){if(navigator.vibrate)navigator.vibrate(12)})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)arm()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  arm();
})();
</script>
</body>
</html>
