<style>
:root{--bg:#0b1018;--panel:#111923;--panel2:#0d141d;--line:rgba(255,255,255,.10);--text:#f7f8fb;--muted:#aab5c5;--dim:#778397;--amber:#ffb52f;--cyan:#42ddff;--green:#62e9a2;--orange:#ff7b50;--neutral:#eef2f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}body{min-height:100dvh;max-width:1180px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));overflow-x:hidden;background:radial-gradient(circle at 90% 0,rgba(66,221,255,.07),transparent 27%),radial-gradient(circle at 4% 2%,rgba(255,181,47,.09),transparent 24%),var(--bg)}button,a{font:inherit}
header{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:30px;font-weight:950;letter-spacing:-1.3px}.brand span{color:var(--amber)}.header-right{display:flex;align-items:center;gap:7px}.shadow{height:44px;min-width:82px;padding:0 12px;border:1px solid rgba(255,181,47,.24);border-radius:999px;background:rgba(255,181,47,.08);color:var(--text);font-size:10px;font-weight:900;cursor:pointer}.shadow.running{border-color:rgba(66,221,255,.36);background:rgba(66,221,255,.10);color:var(--cyan)}.shadow.done{border-color:rgba(98,233,162,.36);background:rgba(98,233,162,.10);color:var(--green)}.version{font-size:7.5px;color:var(--dim);font-weight:850;white-space:nowrap}.head{display:flex;align-items:end;justify-content:space-between;margin:10px 2px 5px}.head b{font-size:8.5px;letter-spacing:1.25px}.head span{font-size:7.5px;color:var(--dim)}
.now-section[hidden]{display:none}.now{border:1px solid rgba(66,221,255,.25);border-radius:19px;padding:12px 13px;background:linear-gradient(135deg,rgba(66,221,255,.13),rgba(17,25,35,.96) 60%)}.now-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.now-title{min-width:0;font-size:17px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resume{flex:0 0 auto;min-height:44px;padding:0 13px;border:1px solid rgba(66,221,255,.28);border-radius:13px;color:var(--text);background:rgba(66,221,255,.08);display:flex;align-items:center;font-size:9.5px;font-weight:900;cursor:pointer}.now-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.device-pills{display:flex;gap:6px;min-width:0}.device{min-height:44px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--muted);display:flex;align-items:center;font-size:9px;font-weight:850;cursor:pointer}.device.active{border-color:rgba(66,221,255,.30);color:var(--text);background:rgba(66,221,255,.08)}.now-meta{font-size:8px;color:var(--dim);white-space:nowrap}
.start-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.start{min-width:0;min-height:78px;border:1px solid var(--line);border-radius:17px;padding:9px 5px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(13,20,29,.95));text-align:center;cursor:pointer}.start-icon{font-size:24px;line-height:1}.start b{font-size:11.5px}.start small{display:none}.start.rec{border-color:rgba(255,123,80,.28);background:linear-gradient(145deg,rgba(255,123,80,.13),rgba(13,20,29,.96) 72%)}.start.beat{border-color:rgba(255,181,47,.28);background:linear-gradient(145deg,rgba(255,181,47,.12),rgba(13,20,29,.96) 72%)}.start.mix{border-color:rgba(66,221,255,.25);background:linear-gradient(145deg,rgba(66,221,255,.11),rgba(13,20,29,.96) 72%)}.start.think{border-color:rgba(98,233,162,.24);background:linear-gradient(145deg,rgba(98,233,162,.10),rgba(13,20,29,.96) 72%)}
.keyz{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.key{min-width:0;min-height:46px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font-size:9px;font-weight:850;padding:2px;cursor:pointer}.apps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.app{position:relative;min-width:0;min-height:64px;border:1px solid rgba(255,255,255,.07);border-radius:14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--panel)}.app i{font-style:normal;font-size:20px;line-height:1}.app b{max-width:100%;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-key{display:none;position:absolute;right:7px;top:6px;color:#778397;font-size:8px;font-weight:900}.app.learn{border-color:rgba(66,221,255,.13)}.app.create{border-color:rgba(255,123,80,.13)}.app.life{border-color:rgba(98,233,162,.12)}.app.faith{border-color:rgba(255,181,47,.14)}.app.tool{border-color:rgba(238,242,248,.12)}
.start:active,.app:active,.key:active,.device:active,.shadow:active,.resume:active{transform:scale(.97)}
.desktop-extra{display:none}.recent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recent-item{min-height:58px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none}.recent-item .emoji{font-size:21px}.recent-copy{min-width:0}.recent-copy b{display:block;font-size:10.5px}.recent-copy small{display:block;margin-top:2px;color:#8893a3;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{text-align:center;color:#465161;font-size:7px;margin-top:8px;letter-spacing:.7px}
.keyz-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(3,6,10,.82);backdrop-filter:blur(12px);padding:16px}.keyz-overlay.open{display:flex;flex-direction:column}.keyz-modal{width:min(1180px,100%);height:100%;margin:auto;border:1px solid rgba(255,255,255,.13);border-radius:20px;overflow:hidden;background:#0e1114;box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}.keyz-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid rgba(255,255,255,.09);background:#0e1114}.keyz-bar b{font-size:12px}.keyz-bar span{color:var(--dim);font-size:9px;margin-left:7px}.keyz-close{height:36px;min-width:76px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#171b20;color:var(--text);font-size:10px;font-weight:850;cursor:pointer}.keyz-frame{flex:1;width:100%;border:0;background:#0e1114}
@media(max-width:350px){body{padding-left:9px;padding-right:9px}.start-grid{gap:4px}.start{min-height:72px}.start-icon{font-size:22px}.keyz{gap:3px}.key{font-size:8px}.apps{gap:2px}.app{min-height:60px}.app i{font-size:18px}.app b{font-size:7px}.version{display:none}}
@media(min-width:700px){body{padding:18px 24px}.brand{font-size:40px}.header-right{gap:10px}.shadow{height:42px;font-size:11px}.version{font-size:9px}.head{margin-top:12px;margin-bottom:7px}.head b{font-size:9.5px}.head span{font-size:9px}.now{padding:17px 18px;border-radius:23px}.now-title{font-size:23px}.device{min-height:44px;font-size:10px}.start-grid{gap:10px}.start{min-height:118px;align-items:flex-start;padding:15px;text-align:left}.start-icon{font-size:32px}.start b{font-size:17px}.start small{display:block;font-size:9px;color:var(--muted)}.keyz{gap:8px}.key{min-height:58px;font-size:11px}.apps{gap:9px}.app{min-height:96px;border-radius:18px}.app i{font-size:30px}.app b{font-size:11px}.app-key{display:block}.desktop-extra{display:block}.recent-item{min-height:62px}.keyz-overlay{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">App<span>z</span></div><div class="header-right"><button class="shadow" id="shadowBtn" type="button" aria-label="Shadowzを15分開始">🎧 15m</button><div class="version">v10.1 · 2026.09.06</div></div></header>

<section class="now-section" id="nowSection">
  <div class="head"><b>🎯 NOW</b><span>今やる1件だけ</span></div>
  <div class="now">
    <div class="now-top"><div class="now-title" id="nowTitle">読み込み中…</div><button class="resume" id="resumeBtn" type="button">▶ RESUME</button></div>
    <div class="now-bottom"><div class="device-pills"><button class="device" id="winBtn" type="button">🖥 Win</button><button class="device" id="macBtn" type="button">💻 Mac</button></div><div class="now-meta" id="nowMeta">Appz NOW</div></div>
  </div>
</section>

<div class="head"><b>⚡ START</b><span>作業モード</span></div>
<div class="start-grid">
  <button class="start rec" type="button" data-keyz-tab="cubase"><span class="start-icon">🎙️</span><b>REC</b><small>Cubase / Vocal</small></button>
  <button class="start beat" type="button" data-keyz-tab="fl"><span class="start-icon">🎹</span><b>BEAT</b><small>FL / Quick Beat Make</small></button>
  <button class="start mix" type="button" data-keyz-tab="cubase"><span class="start-icon">🎚️</span><b>MIX</b><small>Cubase / Mix & Master</small></button>
  <button class="start think" id="thinkBtn" type="button"><span class="start-icon">🧠</span><b>THINK</b><small>ChatGPT / Decide</small></button>
</div>

<div class="head"><b>⌨️ QUICK KEYZ</b><span>Kで開く</span></div>
<div class="keyz">
  <button class="key" type="button" data-keyz-tab="fl">🎹 FL</button>
  <button class="key" type="button" data-keyz-tab="cubase">🎚️ Cubase</button>
  <button class="key" type="button" data-keyz-tab="win">🖥 Win</button>
  <button class="key" type="button" data-keyz-tab="mac">💻 Mac</button>
  <button class="key" type="button" data-keyz-tab="notion">📝 Notion</button>
</div>

<div class="head"><b>⚡ APPS</b><span>1〜8で起動</span></div>
<div class="apps" id="toolGrid">
  <a class="app learn" data-tool data-name="Flowz" data-emoji="🗣️" href="https://xxkedy.github.io/flowz/"><span class="app-key">1</span><i>🗣️</i><b>Flowz</b></a>
  <a class="app create" data-tool data-name="Barz" data-emoji="🎤" href="https://xxkedy.github.io/keyz/barz/?quick=1"><span class="app-key">2</span><i>🎤</i><b>Barz</b></a>
  <a class="app life" data-tool data-name="Gainz" data-emoji="💪" href="https://xxkedy.github.io/gainz/"><span class="app-key">3</span><i>💪</i><b>Gainz</b></a>
  <a class="app life" data-tool data-name="Fightz" data-emoji="🥊" href="https://xxkedy.github.io/keyz/fightz/"><span class="app-key">4</span><i>🥊</i><b>Fightz</b></a>
  <a class="app life" data-tool data-name="Urgez" data-emoji="🛡️" href="https://xxkedy.github.io/keyz/urgez/"><span class="app-key">5</span><i>🛡️</i><b>Urgez</b></a>
  <a class="app faith" data-tool data-name="Islamz" data-emoji="🕌" href="https://xxkedy.github.io/keyz/islamz/"><span class="app-key">6</span><i>🕌</i><b>Islamz</b></a>
  <a class="app tool" data-tool data-name="Keyz" data-emoji="⌨️" href="https://xxkedy.github.io/keyz/"><span class="app-key">7</span><i>⌨️</i><b>Keyz</b></a>
  <a class="app create" data-tool data-name="Tagz" data-emoji="🏷️" href="https://xxkedy.github.io/tagz/"><span class="app-key">8</span><i>🏷️</i><b>Tagz</b></a>
</div>

<div class="desktop-extra">
  <div class="head"><b>↗️ RECENT</b><span>最近開いた3つ</span></div>
  <div class="recent-grid" id="recentGrid"></div>
</div>
<footer>HQ = DECIDE · APPZ = DO</footer>

<div class="keyz-overlay" id="keyzOverlay" aria-hidden="true"><div class="keyz-modal"><div class="keyz-bar"><div><b>⌨️ Keyz</b><span id="keyzContext">ショートカット早見表</span></div><button class="keyz-close" id="keyzClose" type="button">ESC · 閉じる</button></div><iframe class="keyz-frame" id="keyzFrame" title="Keyz ショートカット早見表"></iframe></div></div>

<script>
(function(){
  var KEYS={shadowEnd:'appz_shadow15_end',shadowDone:'appz_gapz_shadow_done',shadowSource:'appz_gapz_shadow_source',history:'appz_gapz_history',recent:'appz_recent_tools'};
  var SHADOW_MS=15*60*1000,timer=null,ticker=null,current=null,nowAction={active:false,title:'',device:'',context:'',tab:''};
  var SOURCES={improv:{id:'improv',label:'TED',url:'https://www.ted.com/talks/charles_limb_your_brain_on_improv'},sound:{id:'sound',label:'TED',url:'https://www.ted.com/talks/dallas_taylor_what_silence_can_teach_you_about_sound'},confidence:{id:'confidence',label:'TED',url:'https://www.ted.com/talks/david_kelley_how_to_build_your_creative_confidence'}};
  var SOURCE_IDS=['sound','improv','confidence'];
  var shadowBtn=document.getElementById('shadowBtn'),overlay=document.getElementById('keyzOverlay'),keyzFrame=document.getElementById('keyzFrame'),keyzContext=document.getElementById('keyzContext'),toolEls=Array.prototype.slice.call(document.querySelectorAll('.app[data-tool]'));
  function read(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value}catch(e){return fallback}}
  function write(key,value){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,String(value))}catch(e){}}
  function readNumber(key){return Number(read(key,0)||0)}
  function dayKey(value){var d=value instanceof Date?value:new Date(value||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
  function isDesktop(){return window.matchMedia('(min-width:700px)').matches}
  function sourceForToday(){var saved=read(KEYS.shadowSource,'');if(saved&&SOURCES[saved]&&readNumber(KEYS.shadowEnd)>Date.now())return SOURCES[saved];var stamp=Number(dayKey().replace(/-/g,''));return SOURCES[SOURCE_IDS[stamp%SOURCE_IDS.length]]}
  function record(kind,source,endedAt){var items=[];try{items=JSON.parse(read(KEYS.history,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}items.push({kind:kind,source:source||'',completedAt:new Date(endedAt).toISOString()});write(KEYS.history,JSON.stringify(items.slice(-30)))}
  function finishExpired(showNotice){var end=readNumber(KEYS.shadowEnd);if(!end||end>Date.now())return null;var source=read(KEYS.shadowSource,'');write(KEYS.shadowDone,dayKey(end));write(KEYS.shadowEnd,null);write(KEYS.shadowSource,null);record('shadowz',source,end);var finished={title:'🎧 Shadowz 完了',body:'15分完了。もう1回やるならAppzからそのまま開始。'};if(showNotice)notify(finished.title,finished.body);return finished}
  function chooseShadow(){var end=readNumber(KEYS.shadowEnd),source=sourceForToday();return end>Date.now()?{running:true,end:end,source:source}:{running:false,source:source}}
  function renderShadow(done){current=chooseShadow();shadowBtn.classList.remove('running','done');if(done){shadowBtn.classList.add('done');shadowBtn.textContent='✓ DONE'}else if(current.running){shadowBtn.classList.add('running');shadowBtn.textContent='🎧 '+fmt(current.end-Date.now())}else shadowBtn.textContent='🎧 15m'}
  function notify(head,body){if('serviceWorker' in navigator&&'Notification' in window&&Notification.permission==='granted'){navigator.serviceWorker.ready.then(function(reg){return reg.showNotification(head,{body:body,tag:'appz-shadowz',renotify:true})}).catch(function(){try{new Notification(head,{body:body})}catch(e){}})}document.title='✓ Shadowz · Appz'}
  function armShadow(){clearTimeout(timer);clearInterval(ticker);var done=finishExpired(false);renderShadow(done);if(done)setTimeout(function(){document.title='Appz';renderShadow(false)},1800);current=chooseShadow();if(!current.running)return;timer=setTimeout(function(){var finished=finishExpired(true);renderShadow(finished);setTimeout(function(){document.title='Appz';renderShadow(false)},1800)},current.end-Date.now());ticker=setInterval(function(){var action=chooseShadow();if(!action.running){clearInterval(ticker);renderShadow(false)}else shadowBtn.textContent='🎧 '+fmt(action.end-Date.now())},1000)}
  function askNotification(){if('Notification' in window&&Notification.permission==='default'){try{var request=Notification.requestPermission();if(request&&request.catch)request.catch(function(){})}catch(e){}}}
  function startShadow(){finishExpired(false);current=chooseShadow();if(!current.running){write(KEYS.shadowSource,current.source.id);write(KEYS.shadowEnd,Date.now()+SHADOW_MS)}var tab=window.open(current.source.url,'_blank');if(tab){try{tab.opener=null}catch(e){}}else location.href=current.source.url;if(navigator.vibrate)navigator.vibrate(12);askNotification();armShadow()}
  function openKeyz(tabId){if(tabId)write('keyz_tab',tabId);if(!isDesktop()){location.href='https://xxkedy.github.io/keyz/';return}keyzContext.textContent=tabId?('最初から '+tabId.toUpperCase()):'ショートカット早見表';keyzFrame.src='https://xxkedy.github.io/keyz/?appz='+Date.now();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}
  function closeKeyz(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');keyzFrame.src=''}
  function openExternal(url){var tab=window.open(url,'_blank');if(tab){try{tab.opener=null}catch(e){}}else location.href=url}
  function rememberTool(el){var item={name:el.dataset.name||el.textContent.trim(),emoji:el.dataset.emoji||'↗',href:el.href,at:Date.now()},items=[];try{items=JSON.parse(read(KEYS.recent,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}items=items.filter(function(x){return x&&x.href!==item.href});items.unshift(item);write(KEYS.recent,JSON.stringify(items.slice(0,3)));renderRecent()}
  function renderRecent(){var box=document.getElementById('recentGrid');if(!box)return;var items=[];try{items=JSON.parse(read(KEYS.recent,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}if(!items.length){box.innerHTML='<div class="recent-item"><span class="emoji">↗️</span><span class="recent-copy"><b>まだ履歴なし</b><small>Appを開くとここに3件出る</small></span></div>';return}box.innerHTML=items.slice(0,3).map(function(x){var mins=Math.max(0,Math.floor((Date.now()-Number(x.at||Date.now()))/60000)),when=mins<1?'たった今':mins<60?mins+'分前':Math.floor(mins/60)+'時間前';return '<a class="recent-item" href="'+String(x.href).replace(/"/g,'&quot;')+'"><span class="emoji">'+(x.emoji||'↗️')+'</span><span class="recent-copy"><b>'+String(x.name||'App')+'</b><small>'+when+'</small></span></a>'}).join('')}
  function renderNow(data){var section=document.getElementById('nowSection');nowAction=data&&typeof data==='object'?data:{active:false};if(nowAction.active===false||!nowAction.title){section.hidden=true;return}section.hidden=false;document.getElementById('nowTitle').textContent=nowAction.title;document.getElementById('nowMeta').textContent=(nowAction.context||'Appz')+(nowAction.updated?' · '+nowAction.updated:'');document.getElementById('winBtn').classList.toggle('active',nowAction.device==='win');document.getElementById('macBtn').classList.toggle('active',nowAction.device==='mac')}
  function loadNow(){fetch('./now.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('now');return r.json()}).then(renderNow).catch(function(){renderNow({active:false})})}
  shadowBtn.addEventListener('click',startShadow);
  document.getElementById('resumeBtn').addEventListener('click',function(){openKeyz(nowAction.tab||(nowAction.device==='mac'?'mac':nowAction.device==='win'?'win':''))});
  document.getElementById('winBtn').addEventListener('click',function(){openKeyz('win')});
  document.getElementById('macBtn').addEventListener('click',function(){openKeyz('mac')});
  document.getElementById('thinkBtn').addEventListener('click',function(){openExternal('https://chatgpt.com/')});
  document.querySelectorAll('[data-keyz-tab]').forEach(function(el){el.addEventListener('click',function(){openKeyz(el.dataset.keyzTab)})});
  document.getElementById('keyzClose').addEventListener('click',closeKeyz);overlay.addEventListener('click',function(e){if(e.target===overlay)closeKeyz()});
  document.querySelectorAll('a[data-tool]').forEach(function(card){card.addEventListener('click',function(e){if(card.dataset.name==='Keyz'&&isDesktop()){e.preventDefault();rememberTool(card);openKeyz();return}rememberTool(card);if(navigator.vibrate)navigator.vibrate(12)})});
  document.addEventListener('keydown',function(e){if(!isDesktop())return;var tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||e.ctrlKey||e.altKey||e.metaKey)return;if(overlay.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeKeyz()}return}if(e.key.toLowerCase()==='k'){e.preventDefault();openKeyz();return}var n=Number(e.key);if(n>=1&&n<=8&&toolEls[n-1]){e.preventDefault();toolEls[n-1].click()}});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){armShadow();loadNow();renderRecent()}});
  window.addEventListener('resize',function(){if(!isDesktop()&&overlay.classList.contains('open'))closeKeyz()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  renderRecent();loadNow();armShadow();
})();
</script>
</body>
</html>
