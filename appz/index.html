<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Appz">
<link rel="manifest" href="./manifest.json?v=20260806-1">
<link rel="apple-touch-icon" href="./icon-180.png?v=20260729-1">
<link rel="icon" href="./icon-192.png?v=20260729-1">
<title>Appz</title>
<style>
:root{--bg:#0b0b0e;--panel:#15151b;--panel2:#1c1c23;--line:#2b2b35;--text:#f5f3ee;--muted:#9898a4;--dim:#666671;--amber:#ff9e2c;--cyan:#22d3ee;--green:#4ade80;--orange:#ff6b35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
body{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:end;justify-content:space-between;margin:2px 3px 14px}.brand h1{font-size:40px;line-height:.9;margin:0;font-weight:950;letter-spacing:-1px}.brand h1 span{color:var(--amber)}.brand p{font-size:9px;color:var(--muted);letter-spacing:2.2px;margin:7px 0 0;font-weight:800}.version{font-size:9px;color:var(--dim);letter-spacing:.7px;margin-bottom:1px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 3px 8px}.section-head b{font-size:10px;letter-spacing:1.5px;color:var(--muted)}.section-head span{font-size:9.5px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{--accent:var(--amber);display:flex;align-items:center;gap:10px;min-width:0;min-height:82px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);text-decoration:none;position:relative;overflow:hidden;transition:.08s}.card:active{transform:scale(.976);background:var(--panel2)}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.card.cyan{--accent:var(--cyan)}.card.green{--accent:var(--green)}.card.orange{--accent:var(--orange)}
.iconbox{width:43px;height:43px;border-radius:12px;background:#09090b;border:1px solid #34343d;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}.copy{min-width:0}.card h3{font-size:16px;line-height:1.1;margin:0}.card p{font-size:10px;line-height:1.35;color:var(--muted);margin:5px 0 0}.arrow{margin-left:auto;color:var(--accent);font-size:17px;font-weight:900;flex:none}
.quick{--accent:var(--amber);width:100%;min-height:74px;border:1px solid #4a3822;background:linear-gradient(145deg,#20170d,var(--panel));font:inherit;text-align:left;cursor:pointer}.quick.running{--accent:var(--cyan);border-color:#27505a;background:linear-gradient(145deg,#0e2025,var(--panel))}.quick.done{--accent:var(--green);border-color:#294936;background:linear-gradient(145deg,#0e1d14,var(--panel))}.quick-time{min-width:54px;text-align:right;color:var(--accent);font-size:14px;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.standby{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#111116;overflow:hidden}.standby summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer}.standby summary::-webkit-details-marker{display:none}.standby-title{font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--muted)}.standby-meta{font-size:9.5px;color:var(--dim)}.standby[open] summary{border-bottom:1px solid var(--line)}.standby .inner{padding:9px}.standby .card{min-height:76px;background:#121218;opacity:.86}.standby .card:before{background:#565661}.standby .arrow{color:#777782}.badge{display:inline-flex;margin-top:5px;padding:3px 6px;border:1px solid #34343d;border-radius:999px;color:#777782;font-size:8.5px;font-weight:800}
footer{text-align:center;color:#4f4f59;font-size:9px;margin-top:18px;letter-spacing:.8px}
@media(max-width:360px){.grid{grid-template-columns:1fr}.card{min-height:76px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><h1>App<span>z</span></h1><p>YOUR TOOL DECK</p></div><div class="version">v8 · 2026.08.08</div></header>

<div class="section-head"><b>⚡ QUICK</b><span>すぐ始める</span></div>
<button class="card quick" type="button" id="shadowBtn">
<span class="iconbox">🎧</span>
<span class="copy"><h3>Shadowz</h3><p id="shadowStatus">Netflix · 15分シャドーイング</p></span>
<span class="quick-time" id="shadowTime">15:00</span>
</button>

<div class="section-head"><b>🚀 ACTIVE</b><span>よく使う</span></div>
<div class="grid">
<a class="card cyan" href="https://xxkedy.github.io/flowz/"><span class="iconbox">🗣️</span><span class="copy"><h3>Flowz</h3><p>英語スピーキング</p></span><span class="arrow">›</span></a>
<a class="card orange" href="https://xxkedy.github.io/keyz/barz/"><span class="iconbox">🎤</span><span class="copy"><h3>Barz</h3><p>フリースタイル・歌詞KEEP</p></span><span class="arrow">›</span></a>
<a class="card green" href="https://xxkedy.github.io/gainz/"><span class="iconbox">💪</span><span class="copy"><h3>Gainz</h3><p>家トレ・動画・記録</p></span><span class="arrow">›</span></a>
<a class="card" href="https://xxkedy.github.io/keyz/"><span class="iconbox">⌨️</span><span class="copy"><h3>Keyz</h3><p>ショートカット早見表</p></span><span class="arrow">›</span></a>
<a class="card cyan" href="https://xxkedy.github.io/digz/"><span class="iconbox">📖</span><span class="copy"><h3>Digz</h3><p>好きな曲の歌詞をディグ</p></span><span class="arrow">›</span></a>
<a class="card orange" href="https://xxkedy.github.io/tagz/"><span class="iconbox">🏷️</span><span class="copy"><h3>Tagz</h3><p>ビート名・出品ブロック</p></span><span class="arrow">›</span></a>
</div>

<details class="standby">
<summary><span class="standby-title">📦 STANDBY</span><span class="standby-meta">後日改修 1 ›</span></summary>
<div class="inner">
<a class="card" href="https://xxkedy.github.io/spotz/"><span class="iconbox">📍</span><span class="copy"><h3>Spotz</h3><p>店選び・食事検索</p><span class="badge">大幅改修待ち</span></span><span class="arrow">›</span></a>
</div>
</details>

<footer>Appz · QUICK / ACTIVE / STANDBY</footer>
<script>
(function(){
  var KEY='appz_shadow15_end',MS=15*60*1000,timer=null,ticker=null;
  var btn=document.getElementById('shadowBtn'),status=document.getElementById('shadowStatus'),time=document.getElementById('shadowTime');
  function getEnd(){var n=0;try{n=Number(localStorage.getItem(KEY)||0)}catch(e){}return n}
  function setEnd(n){try{if(n)localStorage.setItem(KEY,String(n));else localStorage.removeItem(KEY)}catch(e){}}
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
  function render(){var end=getEnd(),left=end-Date.now();btn.classList.remove('running','done');if(left>0){btn.classList.add('running');status.textContent='Netflixでシャドーイング中';time.textContent=fmt(left)}else{status.textContent='Netflix · 15分シャドーイング';time.textContent='15:00'}}
  function notifyDone(){var title='🎧 Shadowz 終了',body='15分完了。今日はここまで。';if('serviceWorker' in navigator&&'Notification' in window&&Notification.permission==='granted'){navigator.serviceWorker.ready.then(function(reg){return reg.showNotification(title,{body:body,tag:'appz-shadowz',renotify:true})}).catch(function(){try{new Notification(title,{body:body})}catch(e){}})}document.title='✓ Shadowz終了 · Appz'}
  function finish(){if(!getEnd())return;clearTimeout(timer);clearInterval(ticker);timer=null;ticker=null;setEnd(0);btn.classList.remove('running');btn.classList.add('done');status.textContent='15分完了';time.textContent='✓';notifyDone()}
  function arm(){clearTimeout(timer);clearInterval(ticker);var left=getEnd()-Date.now();if(left<=0){if(getEnd())finish();else render();return}render();timer=setTimeout(finish,left);ticker=setInterval(function(){var now=getEnd()-Date.now();if(now<=0)finish();else time.textContent=fmt(now)},1000)}
  async function start(){if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}setEnd(Date.now()+MS);document.title='Shadowz · Appz';arm();window.open('https://www.netflix.com/browse','_blank','noopener')}
  btn.addEventListener('click',function(){if(getEnd()>Date.now()){window.open('https://www.netflix.com/browse','_blank','noopener');return}start()});
  document.querySelectorAll('a.card').forEach(function(card){card.addEventListener('click',function(){if(navigator.vibrate)navigator.vibrate(12)})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)arm()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  arm();
})();
</script>
</body>
</html>
