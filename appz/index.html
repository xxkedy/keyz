<title>Appz</title>
<style>
:root{
  --bg:#0b1018;--bg2:#0f1622;--panel:#111923;--panel2:#0d141d;--line:rgba(255,255,255,.09);
  --text:#f7f8fb;--muted:#a9b2c1;--dim:#687385;--amber:#ffb02e;--cyan:#38d9ff;--green:#59e69a;--orange:#ff7448;--neutral:#e8edf5
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
body{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;overflow-x:hidden;background:radial-gradient(circle at 92% -4%,rgba(56,217,255,.07),transparent 28%),radial-gradient(circle at 8% 0%,rgba(255,176,46,.08),transparent 24%),var(--bg)}
button,a{font:inherit}
header{height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.brand h1{font-size:31px;line-height:1;margin:0;font-weight:950;letter-spacing:-1.4px}.brand h1 span{color:var(--amber)}
.header-actions{display:flex;align-items:center;gap:8px}.version{color:var(--dim);font-size:8.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.keyz-head{height:32px;padding:0 11px;border:1px solid rgba(232,237,245,.14);border-radius:999px;background:linear-gradient(180deg,rgba(232,237,245,.08),rgba(232,237,245,.03));color:var(--neutral);font-size:10px;font-weight:900;letter-spacing:.4px;cursor:pointer}
.keyz-head:active{transform:scale(.97)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 6px}.section-head b{font-size:8.5px;letter-spacing:1.7px;color:#7e8999}.section-head span{font-size:8px;color:#5e697a}
.quick{--accent:var(--amber);width:100%;min-height:104px;padding:14px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid rgba(255,176,46,.38);border-radius:24px;background:linear-gradient(135deg,rgba(255,176,46,.19),rgba(17,25,35,.97) 58%);color:var(--text);text-align:left;cursor:pointer;box-shadow:0 18px 44px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.05);transition:transform .1s,border-color .16s,box-shadow .16s}
.quick:active{transform:scale(.982)}.quick.running{--accent:var(--cyan);border-color:rgba(56,217,255,.42);background:linear-gradient(135deg,rgba(56,217,255,.16),rgba(17,25,35,.98) 58%)}.quick.done{--accent:var(--green);border-color:rgba(89,230,154,.42);background:linear-gradient(135deg,rgba(89,230,154,.16),rgba(17,25,35,.98) 58%)}
.hero-icon{width:58px;height:58px;border-radius:18px;background:rgba(7,10,15,.8);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:29px;box-shadow:inset 0 1px rgba(255,255,255,.05)}
.quick-copy{min-width:0}.quick-kicker{display:block;margin-bottom:4px;color:var(--accent);font-size:8.5px;font-weight:950;letter-spacing:1.4px}.quick h2{font-size:19px;line-height:1.12;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick p{font-size:10px;line-height:1.3;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick-time{min-width:58px;padding:9px 8px;border-radius:999px;background:rgba(4,7,11,.58);text-align:center;color:var(--accent);font-size:11px;font-weight:950;font-variant-numeric:tabular-nums}
.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.mini-btn{min-height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(17,25,35,.82);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:10.5px;font-weight:850;cursor:pointer}.mini-btn strong{color:var(--text)}.mini-btn:active{transform:scale(.98)}
.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;row-gap:9px}.tool{position:relative;min-width:0;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-radius:18px;color:var(--text);text-decoration:none;transition:transform .1s,background .15s,border-color .15s,box-shadow .15s}.tool:active{transform:scale(.94)}
.tool-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.11);border-radius:18px;font-size:29px;background:linear-gradient(145deg,#1c2430,#10161f);box-shadow:0 10px 24px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.07)}
.tool-name{max-width:100%;font-size:12.5px;line-height:1.05;font-weight:900;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool-key{display:none;position:absolute;right:10px;top:9px;color:#738094;font-size:9px;font-weight:900}
.tool[data-kind='learn'] .tool-icon{background:linear-gradient(145deg,rgba(56,217,255,.25),#101821 72%);border-color:rgba(56,217,255,.3)}
.tool[data-kind='create'] .tool-icon{background:linear-gradient(145deg,rgba(255,116,72,.27),#101821 72%);border-color:rgba(255,116,72,.3)}
.tool[data-kind='life'] .tool-icon{background:linear-gradient(145deg,rgba(89,230,154,.24),#101821 72%);border-color:rgba(89,230,154,.27)}
.tool[data-kind='faith'] .tool-icon{background:linear-gradient(145deg,rgba(255,176,46,.28),rgba(89,230,154,.13) 44%,#101821 74%);border-color:rgba(255,176,46,.28)}
.tool[data-kind='tool'] .tool-icon{background:linear-gradient(145deg,rgba(232,237,245,.2),#101821 72%);border-color:rgba(232,237,245,.2)}
.desktop-only{display:none}.desktop-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(17,25,35,.96),rgba(13,20,29,.96));padding:14px}.panel-title{font-size:9px;font-weight:950;letter-spacing:1.4px;color:#7e8999;margin-bottom:10px}
.keyz-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.keyz-chip{min-height:54px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:#0d141d;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.keyz-chip b{font-size:11px;color:var(--text)}.keyz-chip small{font-size:8px;color:#6c7788}.keyz-chip:active{transform:scale(.97)}
.recent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recent-item{min-height:58px;border:1px solid var(--line);border-radius:14px;background:#0d141d;color:var(--text);display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none}.recent-item .emoji{font-size:22px}.recent-copy{min-width:0}.recent-copy b{display:block;font-size:11px}.recent-copy small{display:block;margin-top:2px;color:var(--dim);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.standby-row{min-height:52px;margin-top:9px;padding:7px 8px 7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:16px;background:rgba(17,25,35,.78)}.standby-caption{font-size:8.5px;font-weight:900;letter-spacing:1.3px;color:var(--dim);flex:0 0 auto}.standby-links{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:2px}.standby-link{min-width:0;display:flex;align-items:center;gap:5px;padding:5px 7px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:800;border-radius:12px}.standby-link:active{background:rgba(255,255,255,.04)}.standby-link small{color:var(--dim);font-size:8px;font-weight:700}.standby-emoji{font-size:18px}
footer{text-align:center;color:#495466;font-size:7.5px;margin-top:7px;letter-spacing:.8px}
.keyz-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(3,6,10,.82);backdrop-filter:blur(12px);padding:16px}.keyz-overlay.open{display:flex;flex-direction:column}.keyz-modal{width:min(1180px,100%);height:100%;margin:auto;border:1px solid rgba(255,255,255,.13);border-radius:20px;overflow:hidden;background:#0e1114;box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}.keyz-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid rgba(255,255,255,.09);background:#0e1114}.keyz-bar b{font-size:12px}.keyz-bar span{color:var(--dim);font-size:9px;margin-left:7px}.keyz-close{height:32px;min-width:72px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#171b20;color:var(--text);font-size:10px;font-weight:850;cursor:pointer}.keyz-frame{flex:1;width:100%;border:0;background:#0e1114}
@media(max-width:350px){body{padding-left:10px;padding-right:10px}.tool-grid{column-gap:3px}.tool-icon{width:52px;height:52px;border-radius:16px;font-size:26px}.tool-name{font-size:11.5px}.tool{min-height:76px}.quick{grid-template-columns:52px minmax(0,1fr) auto;padding:12px;gap:9px}.hero-icon{width:52px;height:52px;border-radius:16px}.standby-link small{display:none}}
@media(max-height:650px) and (max-width:699px){body{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}header{height:32px}.section-head{margin-top:8px;margin-bottom:5px}.quick{min-height:94px}.tool{min-height:72px}.tool-icon{width:51px;height:51px;border-radius:15px;font-size:25px}.tool-name{font-size:11.5px}.standby-row{min-height:42px;margin-top:6px}footer{margin-top:5px}}
@media(min-width:700px){
  body{max-width:1180px;padding:18px 24px 14px;display:flex;flex-direction:column;gap:0}
  header{height:58px}.brand h1{font-size:40px;letter-spacing:-1.8px}.version{font-size:9px}.keyz-head{height:38px;padding:0 16px;font-size:11px}
  .mobile-only{display:none!important}.desktop-only{display:block}
  .section-head{margin-top:10px;margin-bottom:7px}.section-head b{font-size:9px}.section-head span{font-size:9px}
  .desktop-grid{grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:14px;align-items:stretch}
  .desktop-grid>div{display:flex;flex-direction:column}.desktop-grid .panel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px}
  .quick{flex:1;min-height:154px;padding:20px 22px;grid-template-columns:76px minmax(0,1fr) auto;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.24),0 0 34px rgba(255,176,46,.05)}
  .quick:hover{border-color:rgba(255,176,46,.62);box-shadow:0 20px 55px rgba(0,0,0,.28),0 0 38px rgba(255,176,46,.09)}
  .hero-icon{width:76px;height:76px;border-radius:22px;font-size:36px}.quick h2{font-size:26px}.quick p{font-size:12px}.quick-time{min-width:78px;padding:12px 10px;font-size:12px}
  .keyz-grid{grid-template-columns:repeat(2,1fr);gap:9px}.keyz-chip{min-height:62px;border-radius:16px;align-items:flex-start;padding:0 14px;background:linear-gradient(180deg,#121b27,#0d141d)}.keyz-chip b{font-size:13px}.keyz-chip small{font-size:9px}.keyz-chip:last-child{grid-column:1/-1}
  .keyz-chip:nth-child(1){border-color:rgba(255,116,72,.32);background:linear-gradient(145deg,rgba(255,116,72,.13),#0d141d 70%)}
  .keyz-chip:nth-child(2){border-color:rgba(255,116,72,.32);background:linear-gradient(145deg,rgba(255,116,72,.13),#0d141d 70%)}
  .keyz-chip:nth-child(3),.keyz-chip:nth-child(4){border-color:rgba(56,217,255,.28);background:linear-gradient(145deg,rgba(56,217,255,.11),#0d141d 70%)}
  .keyz-chip:nth-child(5){border-color:rgba(255,176,46,.28);background:linear-gradient(145deg,rgba(255,176,46,.11),#0d141d 70%)}
  #xBtnDesktop{margin-top:9px!important;min-height:46px;border-color:rgba(255,176,46,.18);background:linear-gradient(90deg,rgba(255,176,46,.09),rgba(17,25,35,.84))}
  .tool-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.tool{min-height:112px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(17,25,35,.82),rgba(13,20,29,.74));box-shadow:inset 0 1px rgba(255,255,255,.025)}
  .tool:hover{transform:translateY(-2px);background:linear-gradient(180deg,rgba(20,30,42,.96),rgba(13,20,29,.86));box-shadow:0 14px 28px rgba(0,0,0,.22)}
  .tool[data-kind='learn']:hover{border-color:rgba(56,217,255,.34)}.tool[data-kind='create']:hover{border-color:rgba(255,116,72,.34)}.tool[data-kind='life']:hover{border-color:rgba(89,230,154,.32)}.tool[data-kind='faith']:hover{border-color:rgba(255,176,46,.34)}.tool[data-kind='tool']:hover{border-color:rgba(232,237,245,.28)}
  .tool-icon{width:62px;height:62px;border-radius:19px;font-size:31px}.tool-name{font-size:13px}.tool-key{display:block}
  .desktop-lower{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;align-items:end;margin-top:10px}
  .desktop-lower>.desktop-only{min-width:0}.desktop-lower .section-head{margin-top:0}
  .recent-grid{grid-template-columns:repeat(3,1fr);gap:8px}.recent-item{min-height:68px;background:linear-gradient(180deg,rgba(17,25,35,.9),rgba(13,20,29,.82));border-radius:16px}.recent-item:hover{border-color:rgba(56,217,255,.24)}
  .standby-row{height:68px;margin-top:0;border-radius:16px;padding:9px 12px;background:linear-gradient(180deg,rgba(17,25,35,.88),rgba(13,20,29,.8))}
  .standby-links{gap:7px}.standby-link{padding:8px 9px}.keyz-overlay{padding:22px}
  footer{grid-column:1/-1;margin-top:0;padding-top:2px}
}
@media(min-width:700px) and (max-width:980px){.tool-grid{grid-template-columns:repeat(4,1fr)}.desktop-grid{grid-template-columns:1.2fr .8fr}.desktop-lower{grid-template-columns:1fr}.standby-row{height:auto}.recent-grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>App<span>z</span></h1></div>
  <div class="header-actions">
    <button class="keyz-head" id="keyzHead" type="button">⌨ KEYZ</button>
    <div class="version">v9.6 · 2026.09.03</div>
  </div>
</header>

<div class="desktop-grid">
  <div>
    <div class="section-head"><b>GAPZ</b><span>何回でもShadowz</span></div>
    <button class="quick" type="button" id="gapzBtn">
      <span class="hero-icon" id="gapzIcon">🗣️</span>
      <span class="quick-copy"><span class="quick-kicker">SHADOWZ</span><h2 id="gapzTitle">Shadowz · TED</h2><p id="gapzStatus">英字幕だけ · 訳さず15分</p></span>
      <span class="quick-time" id="gapzTime">START</span>
    </button>
    <div class="mini-actions mobile-only">
      <button class="mini-btn" type="button" id="xBtnMobile">🔖 <strong>Xブクマ</strong> 3分</button>
      <button class="mini-btn" type="button" id="keyzMobile">⌨️ <strong>Keyz</strong> ショートカット</button>
    </div>
  </div>

  <div class="desktop-only">
    <div class="section-head"><b>QUICK KEYZ</b><span>Kで開く</span></div>
    <div class="panel">
      <div class="keyz-grid">
        <button class="keyz-chip" data-keyz-tab="fl"><b>FL</b><small>F5 / F6 / F7...</small></button>
        <button class="keyz-chip" data-keyz-tab="cubase"><b>Cubase</b><small>REC / Edit</small></button>
        <button class="keyz-chip" data-keyz-tab="win"><b>Win</b><small>OS操作</small></button>
        <button class="keyz-chip" data-keyz-tab="mac"><b>Mac</b><small>OS操作</small></button>
        <button class="keyz-chip" data-keyz-tab="notion"><b>Notion</b><small>入力 / 移動</small></button>
      </div>
      <button class="mini-btn" type="button" id="xBtnDesktop" style="width:100%;margin-top:8px">🔖 <strong>Xブクマ</strong> 3分だけ開く</button>
    </div>
  </div>
</div>

<div class="section-head"><b>APPS</b><span>1〜7で起動</span></div>
<div class="tool-grid" id="toolGrid">
  <a class="tool" data-tool data-name="Flowz" data-emoji="🗣️" data-kind="learn" href="https://xxkedy.github.io/flowz/" aria-label="Flowz 英語スピーキング"><span class="tool-key">1</span><span class="tool-icon">🗣️</span><span class="tool-name">Flowz</span></a>
  <a class="tool" data-tool data-name="Barz" data-emoji="🎤" data-kind="create" href="https://xxkedy.github.io/keyz/barz/?quick=1" aria-label="Barz すぐラップ開始"><span class="tool-key">2</span><span class="tool-icon">🎤</span><span class="tool-name">Barz</span></a>
  <a class="tool" data-tool data-name="Gainz" data-emoji="💪" data-kind="life" href="https://xxkedy.github.io/gainz/" aria-label="Gainz 家トレ"><span class="tool-key">3</span><span class="tool-icon">💪</span><span class="tool-name">Gainz</span></a>
  <a class="tool" data-tool data-name="Urgez" data-emoji="🛡️" data-kind="life" href="https://xxkedy.github.io/keyz/urgez/" aria-label="Urgez 誘惑ストッパー"><span class="tool-key">4</span><span class="tool-icon">🛡️</span><span class="tool-name">Urgez</span></a>
  <a class="tool" data-tool data-name="Islamz" data-emoji="🕌" data-kind="faith" href="https://xxkedy.github.io/keyz/islamz/" aria-label="Islamz イスラム学習"><span class="tool-key">5</span><span class="tool-icon">🕌</span><span class="tool-name">Islamz</span></a>
  <a class="tool" data-tool data-name="Keyz" data-emoji="⌨️" data-kind="tool" href="https://xxkedy.github.io/keyz/" aria-label="Keyz ショートカット"><span class="tool-key">6</span><span class="tool-icon">⌨️</span><span class="tool-name">Keyz</span></a>
  <a class="tool" data-tool data-name="Tagz" data-emoji="🏷️" data-kind="create" href="https://xxkedy.github.io/tagz/" aria-label="Tagz ビート名"><span class="tool-key">7</span><span class="tool-icon">🏷️</span><span class="tool-name">Tagz</span></a>
</div>

<div class="desktop-lower">
  <div class="desktop-only">
    <div class="section-head"><b>RECENT</b><span>最近開いた3つ</span></div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>
  <div>
    <div class="section-head desktop-only"><b>STANDBY</b><span>必要な時だけ</span></div>

      <span class="standby-caption">STANDBY</span>

        <a class="standby-link" data-tool data-name="Digz" data-emoji="📖" href="https://xxkedy.github.io/digz/" aria-label="Digz 未運用"><span class="standby-emoji">📖</span><span>Digz</span><small>未運用</small></a>
        <a class="standby-link" data-tool data-name="Spotz" data-emoji="📍" href="https://xxkedy.github.io/spotz/" aria-label="Spotz 改修待ち"><span class="standby-emoji">📍</span><span>Spotz</span><small>改修待ち</small></a>
      </div>
    </div>
  </div>
  <footer>ONE SCREEN DECK</footer>
</div>

<div class="keyz-overlay" id="keyzOverlay" aria-hidden="true">

    <iframe class="keyz-frame" id="keyzFrame" title="Keyz ショートカット早見表"></iframe>
  </div>
</div>

<script>
(function(){
  var KEYS={
    shadowEnd:'appz_shadow15_end',
    shadowDone:'appz_gapz_shadow_done',
    shadowSource:'appz_gapz_shadow_source',
    xEnd:'appz_gapz_x_end',
    xSessions:'appz_gapz_x_sessions',
    history:'appz_gapz_history',
    recent:'appz_recent_tools'
  };
  var SHADOW_MS=15*60*1000,X_MS=3*60*1000,X_URL='https://x.com/i/bookmarks',timer=null,ticker=null,xTimer=null,current=null;
  var SOURCES={
    improv:{id:'improv',label:'TED',url:'https://www.ted.com/talks/charles_limb_your_brain_on_improv'},
    sound:{id:'sound',label:'TED',url:'https://www.ted.com/talks/dallas_taylor_what_silence_can_teach_you_about_sound'},
    confidence:{id:'confidence',label:'TED',url:'https://www.ted.com/talks/david_kelley_how_to_build_your_creative_confidence'}
  };
  var SOURCE_IDS=['sound','improv','confidence'];
  var btn=document.getElementById('gapzBtn'),icon=document.getElementById('gapzIcon'),title=document.getElementById('gapzTitle'),status=document.getElementById('gapzStatus'),time=document.getElementById('gapzTime');
  var overlay=document.getElementById('keyzOverlay'),keyzFrame=document.getElementById('keyzFrame'),keyzContext=document.getElementById('keyzContext');
  var toolEls=Array.prototype.slice.call(document.querySelectorAll('.tool[data-tool]'));

  function read(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value}catch(e){return fallback}}
  function write(key,value){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,String(value))}catch(e){}}
  function readNumber(key){return Number(read(key,0)||0)}
  function dayKey(value){var d=value instanceof Date?value:new Date(value||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
  function isDesktop(){return window.matchMedia('(min-width:700px)').matches}
  function sourceForToday(){var saved=read(KEYS.shadowSource,'');if(saved&&SOURCES[saved]&&readNumber(KEYS.shadowEnd)>Date.now())return SOURCES[saved];var stamp=Number(dayKey().replace(/-/g,''));return SOURCES[SOURCE_IDS[stamp%SOURCE_IDS.length]]}
  function record(kind,source,endedAt){var items=[];try{items=JSON.parse(read(KEYS.history,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}items.push({kind:kind,source:source||'',completedAt:new Date(endedAt).toISOString()});write(KEYS.history,JSON.stringify(items.slice(-30)))}
  function addXSession(endedAt){var day=dayKey(endedAt),data={day:day,count:0};try{var parsed=JSON.parse(read(KEYS.xSessions,'{}'));if(parsed&&parsed.day===day)data=parsed}catch(e){}data.count=Number(data.count||0)+1;write(KEYS.xSessions,JSON.stringify(data))}
  function finishExpired(showNotice){
    var now=Date.now(),shadowEnd=readNumber(KEYS.shadowEnd),xEnd=readNumber(KEYS.xEnd),finished=null;
    if(shadowEnd&&shadowEnd<=now){
      var source=read(KEYS.shadowSource,'');
      write(KEYS.shadowDone,dayKey(shadowEnd));
      write(KEYS.shadowEnd,null);write(KEYS.shadowSource,null);
      record('shadowz',source,shadowEnd);
      finished={kind:'shadow',title:'🎧 Shadowz 完了',body:'15分完了。もう1回やるならAppzからそのまま開始。'}
    }
    if(xEnd&&xEnd<=now){
      write(KEYS.xEnd,null);addXSession(xEnd);record('x-bookmarks','x',xEnd);
      if(!finished)finished={kind:'x',title:'🔖 X学習 完了',body:'3分完了。'}
    }
    if(finished&&showNotice)notify(finished.title,finished.body);
    return finished
  }
  function choose(){
    var now=Date.now(),shadowEnd=readNumber(KEYS.shadowEnd),source=sourceForToday();
    if(shadowEnd>now)return{kind:'shadow',running:true,end:shadowEnd,source:source,url:source.url};
    return{kind:'shadow',running:false,source:source,url:source.url}
  }
  function render(done){
    current=choose();btn.classList.remove('running','done');
    if(done&&done.kind==='shadow'){btn.classList.add('done');time.textContent='DONE'}
    else if(current.running){btn.classList.add('running');time.textContent=fmt(current.end-Date.now())}
    else{time.textContent='START'}
    icon.textContent='🗣️';title.textContent='Shadowz · '+current.source.label;
    status.textContent=current.running?'英語のまま追いかけ中':'英字幕だけ · 訳さず15分'
  }
  function notify(head,body){
    if('serviceWorker' in navigator&&'Notification' in window&&Notification.permission==='granted'){
      navigator.serviceWorker.ready.then(function(reg){return reg.showNotification(head,{body:body,tag:'appz-gapz',renotify:true})}).catch(function(){try{new Notification(head,{body:body})}catch(e){}})
    }
    document.title='✓ Gapz完了 · Appz'
  }
  function arm(){
    clearTimeout(timer);clearInterval(ticker);timer=null;ticker=null;
    var done=finishExpired(false);render(done);
    if(done&&done.kind==='shadow')setTimeout(function(){document.title='Appz';render(false)},1800);
    current=choose();if(!current.running)return;
    var left=current.end-Date.now();
    timer=setTimeout(function(){var finished=finishExpired(true);render(finished);setTimeout(function(){document.title='Appz';render(false)},1800)},left);
    ticker=setInterval(function(){var action=choose();if(!action.running){clearInterval(ticker);render(false)}else time.textContent=fmt(action.end-Date.now())},1000)
  }
  function askNotification(){if('Notification' in window&&Notification.permission==='default'){try{var request=Notification.requestPermission();if(request&&request.catch)request.catch(function(){})}catch(e){}}}
  function startShadow(){
    finishExpired(false);current=choose();
    if(!current.running){write(KEYS.shadowSource,current.source.id);write(KEYS.shadowEnd,Date.now()+SHADOW_MS)}
    var tab=window.open(current.url,'_blank');if(tab){try{tab.opener=null}catch(e){}}else{location.href=current.url}
    if(navigator.vibrate)navigator.vibrate(12);askNotification();document.title='Gapz · Appz';arm()
  }
  function armX(){
    clearTimeout(xTimer);xTimer=null;
    var end=readNumber(KEYS.xEnd);if(end<=Date.now())return;
    xTimer=setTimeout(function(){
      var finished=finishExpired(true);
      if(finished&&finished.kind==='x')setTimeout(function(){document.title='Appz'},1800)
    },end-Date.now())
  }
  function startX(){
    finishExpired(false);
    var end=readNumber(KEYS.xEnd);
    if(end<=Date.now())write(KEYS.xEnd,Date.now()+X_MS);
    var tab=window.open(X_URL,'_blank');if(tab){try{tab.opener=null}catch(e){}}else{location.href=X_URL}
    if(navigator.vibrate)navigator.vibrate(12);askNotification();armX()
  }
  function openKeyz(tabId){
    if(tabId)write('keyz_tab',tabId);
    if(!isDesktop()){location.href='https://xxkedy.github.io/keyz/';return}
    keyzContext.textContent=tabId?('最初から '+tabId.toUpperCase()):'ショートカット早見表';
    var src='https://xxkedy.github.io/keyz/?appz='+Date.now();
    keyzFrame.src=src;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')
  }
  function closeKeyz(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');keyzFrame.src=''}
  function rememberTool(el){
    var item={name:el.dataset.name||el.textContent.trim(),emoji:el.dataset.emoji||'↗',href:el.href,at:Date.now()},items=[];
    try{items=JSON.parse(read(KEYS.recent,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}
    items=items.filter(function(x){return x&&x.href!==item.href});
    items.unshift(item);write(KEYS.recent,JSON.stringify(items.slice(0,3)));renderRecent()
  }
  function renderRecent(){
    var box=document.getElementById('recentGrid');if(!box)return;
    var items=[];try{items=JSON.parse(read(KEYS.recent,'[]'));if(!Array.isArray(items))items=[]}catch(e){items=[]}
    if(!items.length){
      box.innerHTML='<div class="recent-item"><span class="emoji">↗</span><span class="recent-copy"><b>まだ履歴なし</b><small>Appを開くとここに3件出る</small></span></div>';
      return
    }
    box.innerHTML=items.slice(0,3).map(function(x){
      var mins=Math.max(0,Math.floor((Date.now()-Number(x.at||Date.now()))/60000));
      var when=mins<1?'たった今':mins<60?mins+'分前':Math.floor(mins/60)+'時間前';
      return '<a class="recent-item" data-recent href="'+String(x.href).replace(/"/g,'&quot;')+'"><span class="emoji">'+(x.emoji||'↗')+'</span><span class="recent-copy"><b>'+String(x.name||'App')+'</b><small>'+when+'</small></span></a>'
    }).join('')
  }

  btn.addEventListener('click',startShadow);
  document.getElementById('xBtnMobile').addEventListener('click',startX);
  document.getElementById('xBtnDesktop').addEventListener('click',startX);
  document.getElementById('keyzHead').addEventListener('click',function(){openKeyz()});
  document.getElementById('keyzMobile').addEventListener('click',function(){openKeyz()});
  document.getElementById('keyzClose').addEventListener('click',closeKeyz);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeKeyz()});
  document.querySelectorAll('[data-keyz-tab]').forEach(function(el){el.addEventListener('click',function(){openKeyz(el.dataset.keyzTab)})});
  document.querySelectorAll('a[data-tool]').forEach(function(card){card.addEventListener('click',function(e){
    if(card.dataset.name==='Keyz'&&isDesktop()){e.preventDefault();rememberTool(card);openKeyz();return}
    if(card.dataset.name)rememberTool(card);if(navigator.vibrate)navigator.vibrate(12)
  })});
  document.addEventListener('keydown',function(e){
    if(!isDesktop())return;
    var tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||e.ctrlKey||e.altKey||e.metaKey)return;
    if(overlay.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeKeyz()}return}
    if(e.key.toLowerCase()==='k'){e.preventDefault();openKeyz();return}
    var n=Number(e.key);if(n>=1&&n<=7&&toolEls[n-1]){e.preventDefault();toolEls[n-1].click()}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden){arm();armX();renderRecent()}});
  window.addEventListener('resize',function(){if(!isDesktop()&&overlay.classList.contains('open'))closeKeyz()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  renderRecent();arm();armX();
})();
</script>
</body>
</html>
